name: United Award Flight Monitor

on:
  schedule:
    - cron: '0 */2 * * *' # 無料枠内（1日12分・9日間で108分消費）で今すぐ自動監視運用を再開
  workflow_dispatch: # 手動実行ボタンも有効

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run United Monitor Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          UNITED_COOKIE: ${{ secrets.UNITED_COOKIE }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          DISCORD_MENTION: "@everyone"
        run: |
          python united_monitor.py
