name: United Award Flight Monitor

on:
  schedule:
    # 日本時間 7:00 (朝), 12:00 (昼), 20:00 (夜) の1日3回定時配信 (月間消費約5〜10分 / 完全無料枠内)
    - cron: '0 22,3,11 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run United Monitor Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          UNITED_COOKIE: ${{ secrets.UNITED_COOKIE }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          DISCORD_MENTION: "@everyone"
        run: |
          python united_monitor.py
